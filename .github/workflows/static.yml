# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Cache product images locally
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/products/k003
          curl --fail --location --retry 3 --retry-all-errors "https://lh3.googleusercontent.com/d/1amLsnlwEcpEpa_IyXmo9r9IC2c2D48K1=w1600" --output assets/products/k003/product-list.jpg
          curl --fail --location --retry 3 --retry-all-errors "https://lh3.googleusercontent.com/d/16BFDrLUVAGfXXKwUnGee42pDyWJcxzV6=w1600" --output assets/products/k003/sns1.jpg
          curl --fail --location --retry 3 --retry-all-errors "https://lh3.googleusercontent.com/d/18UbFDDxWn0uMad4dgzmU4ZwyJ5wx8bCs=w1600" --output assets/products/k003/sns2.jpg
          curl --fail --location --retry 3 --retry-all-errors "https://lh3.googleusercontent.com/d/1d1PPql9Twk5-WwD9a2YrLkdU7dN4vrdF=w1600" --output assets/products/k003/sns3.jpg
          test -s assets/products/k003/product-list.jpg
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
