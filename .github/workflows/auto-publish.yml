name: Auto publish product LP

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/auto-publish.mjs
      - scripts/apply-scene-copy-patch.mjs
      - scripts/apply-google-business-copy-patch.mjs
      - scripts/build-discovery.mjs
      - scripts/build-commerce-discovery.mjs
      - scripts/build-home.mjs
      - scripts/guide-experience.mjs
      - assets/guide-experience.css
      - assets/guide-experience.js
      - assets/guide-dinner-illustration.webp
      - assets/style.css
      - assets/home.css
      - assets/guide-analytics.js
      - scripts/validate-commerce-discovery.mjs
      - scripts/clean-legacy-seo.mjs
      - scripts/enhance-entity-seo.mjs
      - scripts/indexnow.mjs
      - scripts/google-business-post.mjs
      - scripts/gbp-queue.mjs
      - .github/workflows/auto-publish.yml

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: auto-publish-product-lp
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable per-scene copy support
        run: node scripts/apply-scene-copy-patch.mjs

      - name: Publish queued products
        env:
          LP_FEED_URL: https://script.google.com/macros/s/AKfycbwr_19nzaX976Ejm6Oarr1FyvOyasxM5W3Ot5IfKKrr0XugerhPyfWY3qmpOmBCAyzq7Q/exec
        run: |
          for attempt in 1 2; do
            if node scripts/auto-publish.mjs; then
              exit 0
            fi
            if [ "$attempt" -eq 2 ]; then
              echo "Publish failed after the automatic retry."
              exit 1
            fi
            echo "Publish failed; retrying the entire process in 20 seconds..."
            sleep 20
          done

      - name: Clean legacy SEO copy
        run: node scripts/clean-legacy-seo.mjs

      - name: Build search and AI discovery pages
        run: node scripts/build-discovery.mjs

      - name: Enhance entity and category SEO
        run: node scripts/enhance-entity-seo.mjs

      - name: Build purpose comparisons and commerce feed preparation
        run: |
          node scripts/build-commerce-discovery.mjs
          node scripts/build-home.mjs
          node scripts/validate-commerce-discovery.mjs

      - name: Commit published LPs and GBP queue
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No queued products or discovery updates."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add products categories guides about assets/products data/products.json data/products-public.json data/products-public.js data/products-detailed.json data/commerce-candidates.json data/commerce-readiness.json data/gbp-pending.json index.html sitemap.xml w2-sitemap.xml robots.txt llms.txt llms-full.txt
            git commit -m "Auto-publish products and discovery pages"
            # apply-scene-copy-patch.mjs temporarily edits the publisher only for this run.
            # Restore that runtime-only change so it cannot block the rebase/push step.
            git restore scripts/auto-publish.mjs
            git fetch origin main
            git rebase origin/main
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Notify IndexNow
        continue-on-error: true
        run: node scripts/indexnow.mjs
