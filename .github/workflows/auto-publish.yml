name: Auto publish product LP

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/auto-publish.mjs
      - scripts/apply-scene-copy-patch.mjs
      - scripts/apply-google-business-copy-patch.mjs
      - scripts/google-business-post.mjs
      - .github/workflows/auto-publish.yml

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: auto-publish-product-lp
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Require Google Business Profile authentication
        env:
          GBP_CLIENT_ID: ${{ secrets.GBP_CLIENT_ID }}
          GBP_CLIENT_SECRET: ${{ secrets.GBP_CLIENT_SECRET }}
          GBP_REFRESH_TOKEN: ${{ secrets.GBP_REFRESH_TOKEN }}
        run: |
          test -n "$GBP_CLIENT_ID" || { echo "GBP_CLIENT_ID is not configured; publication is blocked."; exit 1; }
          test -n "$GBP_CLIENT_SECRET" || { echo "GBP_CLIENT_SECRET is not configured; publication is blocked."; exit 1; }
          test -n "$GBP_REFRESH_TOKEN" || { echo "GBP_REFRESH_TOKEN is not configured; publication is blocked."; exit 1; }

      - name: Enable per-scene copy support
        run: node scripts/apply-scene-copy-patch.mjs

      - name: Enable AI Google Business copy handoff
        run: node scripts/apply-google-business-copy-patch.mjs

      - name: Publish queued products
        env:
          LP_FEED_URL: https://script.google.com/macros/s/AKfycbwr_19nzaX976Ejm6Oarr1FyvOyasxM5W3Ot5IfKKrr0XugerhPyfWY3qmpOmBCAyzq7Q/exec
        run: |
          for attempt in 1 2; do
            if node scripts/auto-publish.mjs; then
              exit 0
            fi
            if [ "$attempt" -eq 2 ]; then
              echo "Publish failed after the automatic retry."
              exit 1
            fi
            echo "Publish failed; retrying the entire process in 20 seconds..."
            sleep 20
          done

      - name: Capture newly published product IDs
        run: |
          git status --porcelain -- products | awk '{print $2}' | sed -n 's#^products/\([^/]*\)/index.html$#\1#p' | sort -u > /tmp/published_product_ids.txt
          echo "New/updated product LPs:"
          cat /tmp/published_product_ids.txt || true

      - name: Commit published LPs
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No queued products."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add products assets/products data/products.json data/products-public.json index.html sitemap.xml robots.txt llms.txt
            git commit -m "Auto-publish queued product LPs"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Post every published LP to Google Business Profile
        env:
          GBP_CLIENT_ID: ${{ secrets.GBP_CLIENT_ID }}
          GBP_CLIENT_SECRET: ${{ secrets.GBP_CLIENT_SECRET }}
          GBP_REFRESH_TOKEN: ${{ secrets.GBP_REFRESH_TOKEN }}
          GBP_ACCOUNT_ID: ${{ secrets.GBP_ACCOUNT_ID }}
          GBP_LOCATION_ID: ${{ secrets.GBP_LOCATION_ID }}
        run: node scripts/google-business-post.mjs /tmp/published_product_ids.txt

      - name: Notify IndexNow
        continue-on-error: true
        run: node scripts/indexnow.mjs
