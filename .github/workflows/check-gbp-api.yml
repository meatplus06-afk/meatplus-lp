name: Check GBP API approval status

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/check-gbp-api.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Google Business Profile Accounts API
        env:
          GBP_CLIENT_ID: ${{ secrets.GBP_CLIENT_ID }}
          GBP_CLIENT_SECRET: ${{ secrets.GBP_CLIENT_SECRET }}
          GBP_REFRESH_TOKEN: ${{ secrets.GBP_REFRESH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          for name in GBP_CLIENT_ID GBP_CLIENT_SECRET GBP_REFRESH_TOKEN; do
            if [ -z "${!name:-}" ]; then
              echo "$name is not configured."
              exit 2
            fi
          done

          token_http_code="$(curl -sS -o /tmp/oauth_token_response.json -w '%{http_code}' \
            -X POST https://oauth2.googleapis.com/token \
            --data-urlencode "client_id=$GBP_CLIENT_ID" \
            --data-urlencode "client_secret=$GBP_CLIENT_SECRET" \
            --data-urlencode "refresh_token=$GBP_REFRESH_TOKEN" \
            --data-urlencode "grant_type=refresh_token")"
          echo "OAUTH_TOKEN_HTTP_STATUS=$token_http_code"

          node <<'NODE'
          const fs = require('node:fs');
          const raw = fs.readFileSync('/tmp/oauth_token_response.json', 'utf8');
          let data;
          try {
            data = JSON.parse(raw);
          } catch {
            console.log('OAUTH_RESPONSE_JSON=false');
            process.exit(4);
          }
          if (!data.access_token) {
            const error = String(data.error || 'unknown_error').replace(/[\r\n]/g, ' ').slice(0, 120);
            const description = String(data.error_description || '').replace(/[\r\n]/g, ' ').slice(0, 240);
            console.log(`OAUTH_ERROR=${error}`);
            console.log(`OAUTH_ERROR_DESCRIPTION=${description}`);
            process.exit(3);
          }
          fs.writeFileSync('/tmp/gbp_access_token', data.access_token, { mode: 0o600 });
          console.log('OAUTH_TOKEN_OK=true');
          NODE

          access_token="$(cat /tmp/gbp_access_token)"
          accounts_http_code="$(curl -sS -o /tmp/gbp_accounts_response.json -w '%{http_code}' \
            -H "Authorization: Bearer $access_token" \
            -H 'Accept: application/json' \
            'https://mybusinessaccountmanagement.googleapis.com/v1/accounts?pageSize=1')"
          rm -f /tmp/gbp_access_token

          echo "GBP_ACCOUNTS_HTTP_STATUS=$accounts_http_code"
          case "$accounts_http_code" in
            200)
              echo "GBP_API_ACCESS=active"
              ;;
            429)
              echo "GBP_API_ACCESS=quota_blocked_or_pending"
              ;;
            401|403)
              echo "GBP_API_ACCESS=authorization_or_permission_blocked"
              ;;
            *)
              echo "GBP_API_ACCESS=unexpected_status"
              ;;
          esac
